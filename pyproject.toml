[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veridica-agent"
version = "2.0.0"
description = "The Blind Observer of Crypto Twitter — Autonomous AI agent for crypto intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
veridica = "veridica_agent.cli:main"

[project.urls]
Homepage = "https://github.com/heyaerina/veridica"
Repository = "https://github.com/heyaerina/veridica"

[tool.setuptools.packages.find]
where = ["src"]
